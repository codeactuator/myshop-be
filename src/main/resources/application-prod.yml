spring:
  datasource:
    url: jdbc:postgresql:///${myshopdb:myshopdb}?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME:myshop-be:asia-south1:myshopdb}&enableIamAuth=true&sslmode=disable
    username: ${DB_USER:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true
    hibernate:
      ddl-auto: update
  mvc:
    contentnegotiation:
      favor-parameter: false
      media-types:
        json: application/json
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    cache-names:
      - products
      - shopFronts
      - reviews
    redis:
      time-to-live: 10m