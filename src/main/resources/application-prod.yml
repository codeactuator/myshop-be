spring:
  datasource:
    url: jdbc:postgresql:///${myshopdb:myshopdb}?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME:myshop-be:asia-south1:myshopdb}&enableIamAuth=true&sslmode=disable
    username: ${DB_USER:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true
    hibernate:
      ddl-auto: update
  mvc:
    contentnegotiation:
      favor-parameter: false
      media-types:
        json: application/json
  jackson:
    mapper:
      accept-case-insensitive-enums: true

server:
  forward-headers-strategy: framework

jwt:
  # Pulls the secret dynamically from the JWT_SECRET environment variable in production
  secret: "${JWT_SECRET:9a4f2c8d3e1b7f0a5c8e3d2b1a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a10}"
  expiration: 864000000 # 10 days in milliseconds